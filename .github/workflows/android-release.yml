name: Android Signed Release

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        required: true
        type: string
      tag:
        description: Release tag to create
        required: false
        default: ""
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ""
        type: string
      tag:
        description: Optional release tag
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*-detelemetry.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUILD_REF: ${{ inputs.ref || github.ref }}
      RELEASE_TAG_INPUT: ${{ inputs.tag }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Enforce de-telemetry policy
        run: ./scripts/check-no-telemetry.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontEnd/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontEnd
        run: npm ci

      - name: Decode persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "A required Android signing secret is missing" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/detelemetry.keystore"

      - name: Build signed release APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PdetelemetryRepository="${GITHUB_REPOSITORY}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/detelemetry.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify and name release asset
        id: release-info
        run: |
          set -euo pipefail
          source_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$source_apk" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          asset_name="UFI-TOOLS-DeTelemetry_V${version_name}_${short_sha}.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          cp "$source_apk" "$asset_path"

          release_tag="$RELEASE_TAG_INPUT"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$release_tag" ]]; then
            release_tag="v${version_name}-detelemetry.${short_sha}"
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$asset_path"

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-info.outputs.asset_name }}
          path: ${{ steps.release-info.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.release-info.outputs.asset_path }}
          RELEASE_TAG: ${{ steps.release-info.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.release-info.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --target "$SOURCE_SHA" \
              --title "UFI-TOOLS DeTelemetry $RELEASE_TAG" \
              --notes "Automated signed DeTelemetry build from commit $SOURCE_SHA. The confirmed background telemetry and stable-ID message channel are removed."
          fi
